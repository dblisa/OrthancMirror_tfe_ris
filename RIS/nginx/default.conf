
server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # Page de connexion
    location = /login {
        proxy_pass http://auth:8000/login;
        proxy_set_header Host $host;
    }

    # Page d'inscription
    location = /register {
        proxy_pass http://auth:8000/register;
        proxy_set_header Host $host;
    }

    # Déconnexion
    location = /logout {
        proxy_pass http://auth:8000/logout;
        proxy_set_header Host $host;
    }

    # Vérification interne de la session
    location = /auth {
        internal;

        proxy_pass http://auth:8000/auth;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Orthanc Explorer
    location / {
        auth_request /auth;
        error_page 401 = @login_redirect;

        proxy_pass http://orthanc:8042;

        proxy_set_header Host $host;

        # Compte technique Orthanc du prototype
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
    }

    # Utilisateur non connecté
    location @login_redirect {
        return 302 /login;
    }
}
